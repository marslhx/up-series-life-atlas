    &lt;section class=&quot;intro&quot;&gt;
      &lt;h1&gt;十次相见，&lt;br&gt;十四种人生。&lt;/h1&gt;
      &lt;p class=&quot;dek&quot;&gt;从七岁到七十岁。先看一代人的时间纹理，也可以随时进入某个年龄、某个人或几段人生。资料不完整的地方不被填平，只留下诚实的空白。&lt;/p&gt;

          &lt;p class=&quot;notes-statement&quot;&gt;这个项目起于一个朴素的愿望：当《人生七年》走到最后一季，我们能否不急着把十四个人归结成“成功”或“失败”，而是让时间、处境、选择和偶然自己显现出来。&lt;/p&gt;

        &lt;div class=&quot;notes-grid&quot;&gt;
          &lt;section class=&quot;notes-section&quot;&gt;
            &lt;h3&gt;怎样观看这些人生&lt;/h3&gt;
            &lt;ol class=&quot;notes-principles&quot;&gt;
              &lt;li&gt;“时间底片”先让十四个人同时留在画面中，再进入某个年龄或某个人。&lt;/li&gt;
              &lt;li&gt;条件筛选只点亮当时有明确记录或经过标注的状态，尽量不把未知填成确定。&lt;/li&gt;
              &lt;li&gt;人物比较中的曲线和分类是编辑性的观察，用来帮助阅读，不是对幸福或人生价值的评分。&lt;/li&gt;
              &lt;li&gt;“问题回声”用几个重复出现的问题，让不同人生彼此照亮，而不强求他们给出同一种答案。&lt;/li&gt;
            &lt;/ol&gt;
          &lt;/section&gt;
          &lt;section class=&quot;notes-section&quot;&gt;
            &lt;h3&gt;资料从哪里来&lt;/h3&gt;
            &lt;ul class=&quot;source-tiers&quot;&gt;
              &lt;li&gt;&lt;strong&gt;节目与机构&lt;/strong&gt;&lt;span&gt;ITV／ITVX节目资料、参与者直接采访、大学与机构记录。&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;媒体回顾&lt;/strong&gt;&lt;span&gt;同期专访、广播机构人物回顾与具名报道，用于补足阶段状态。&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;社区整理&lt;/strong&gt;&lt;span&gt;豆瓣、抖音等网友整理及外部字幕，默认作为检索线索，不自动等同于正式事实。&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;编辑解读&lt;/strong&gt;&lt;span&gt;命运类别、走势曲线与问题组织由本项目为阅读而设计，与可核查的人物事实分层保存。&lt;/span&gt;&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;
          &lt;section class=&quot;notes-section&quot;&gt;
            &lt;h3&gt;数据边界&lt;/h3&gt;
            &lt;p&gt;这不是《人生七年》的官方档案，也不声称已经覆盖人物生活的全部。网站保留“有出处”、“待核线索”与“暂未整理”的区分；看不见的部分不等于没有发生。若发现事实错误、归属问题或权利疑问，欢迎联系更正。&lt;/p&gt;
          &lt;/section&gt;
